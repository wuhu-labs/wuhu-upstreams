name: tailcat

on:
  push:
    branches: [main]
    paths: [tailcat/**, .github/workflows/tailcat.yml]
  pull_request:
    paths: [tailcat/**, .github/workflows/tailcat.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - kind: apple
            runs-on: macos-latest
          - kind: linux
            runs-on: ubuntu-22.04
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: sed -n 's/^GO_VERSION=//p' tailcat/pin.env > .go-version
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - run: tailcat/build.sh ${{ matrix.kind }} dist
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 * | tee SHA256SUMS-${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        with:
          name: tailcat-${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
