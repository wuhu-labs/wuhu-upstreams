[package]
name = "wuhu_iroh"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
iroh = "=1.5.0"
iroh-relay = { version = "=1.5.0", features = ["server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
panic = "unwind"
strip = "debuginfo"
