[package]
name = "wuhu_iroh"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
iroh = { version = "=1.5.0", features = ["unstable-net-report"] }
iroh-relay = { version = "=1.5.0", features = ["server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
libc = "0.2.191"
rcgen = "0.14.10"

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
panic = "unwind"
strip = "debuginfo"

# Each patched crate comes from a fork at an exact commit; PROVENANCE.md says what each patch changes.
[patch.crates-io]
iroh = { git = "https://github.com/wuhu-labs/iroh", rev = "de269a80fe58ee2239923df682b9e9421c1c0810" }
iroh-base = { git = "https://github.com/wuhu-labs/iroh", rev = "de269a80fe58ee2239923df682b9e9421c1c0810" }
iroh-relay = { git = "https://github.com/wuhu-labs/iroh", rev = "de269a80fe58ee2239923df682b9e9421c1c0810" }
noq = { git = "https://github.com/wuhu-labs/noq", rev = "08630983dfc63b40101b8c50544f11fde23ee1fd" }
noq-proto = { git = "https://github.com/wuhu-labs/noq", rev = "08630983dfc63b40101b8c50544f11fde23ee1fd" }
noq-udp = { git = "https://github.com/wuhu-labs/noq", rev = "08630983dfc63b40101b8c50544f11fde23ee1fd" }
